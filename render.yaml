# Standalone authoritative WebSocket process. The existing Next.js site stays on Vercel.
services:
  - type: web
    name: xarmy-color-hide
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run color-hide:build
    startCommand: node node_modules/.color-hide-server/server/color-hide/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: COLOR_HIDE_ALLOWED_ORIGINS
        value: https://xarmygames.online,https://www.xarmygames.online
